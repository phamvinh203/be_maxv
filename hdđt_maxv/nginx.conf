server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API sang backend (service `api` trong docker-compose) — CÙNG origin nên
  # cookie phiên SameSite=Strict hoạt động.
  location /api/v1/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Tải hóa đơn / xử lý lâu -> nới timeout
    proxy_read_timeout 300s;
  }

  # SPA fallback: mọi route không phải file tĩnh -> index.html (BrowserRouter)
  location / {
    try_files $uri /index.html;
  }
}
